    throw new GradleException("This build requires Gradle 9.6.1, found ${GradleVersion.current()}")
}
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    throw new GradleException("Gradle requires Java 17 or newer, found ${System.getProperty('java.version')}")
}

def sha256Of = { File inputFile ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    inputFile.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString().toUpperCase(Locale.ROOT)
}

