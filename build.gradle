tasks.register('verifyNamespace') {
    group = 'verification'
    doLast {
        fileTree('src/main/java') { include '**/*.java' }.files.each { file ->
            String text = file.getText('UTF-8')
            if (text.contains('com.mcmoddev') || (!text.contains('package zone.moddev.mc.iafbygaddon')
                    && !file.name.startsWith('Generated'))) {
                throw new GradleException("Unexpected Java namespace in ${file}")
            }
        }
        fileTree('src/main/resources/assets/iafbygaddon') { include '**/*' }.files.each { file ->
            if (file.isFile() && file.name.endsWith('.json')) {
                String text = file.getText('UTF-8')
                if (text.contains('ironagefurniture:chair_wood_ironage_')) {
                    throw new GradleException("Generated resource leaks the core namespace: ${file}")
                }
            }
        }
        if (file('src/main/resources/assets/byg').exists()) {
            throw new GradleException('BYG assets must never be redistributed')
        }
    }
}

tasks.register('verifyRepositoryHygiene') {
    group = 'verification'
    doLast {
        byte[] bytes = providers.exec { commandLine 'git', 'ls-files', '-z' }.standardOutput.asBytes.get()
        List<String> tracked = new String(bytes, StandardCharsets.UTF_8).split('\u0000').findAll { it }
        Set<String> forbiddenDirs = ['.agent', '.agents', '.codex', '.gradle', '.idea', '.settings',
                'agent-notes', 'bin', 'build', 'logs', 'run', 'run-dependencies/artifacts'] as Set<String>
        List<String> forbidden = tracked.findAll { path ->
            List<String> parts = path.replace('\\', '/').tokenize('/')
            parts.any { forbiddenDirs.contains(it.toLowerCase(Locale.ROOT)) }
                    || ['.classpath', '.project', '.travis.yml'].contains(parts.last().toLowerCase(Locale.ROOT))
                    || parts.last().toLowerCase(Locale.ROOT) ==~ /(?:agent|codex)-.*\.md/
        }
        if (!forbidden.isEmpty()) throw new GradleException("Forbidden tracked files: ${forbidden}")
        tracked.findAll { file(it).isFile() }.each { path ->
            String name = new File(path).name
            if (archiveTextSuffixes.any { name.endsWith(it) } || ['gradlew', '.gitignore', '.gitattributes'].contains(name)) {
                String text = file(path).getText('UTF-8')
                if (text ==~ /(?s).*(?:[A-Za-z]:[\\\/]Users[\\\/]|\/home\/[^\/]+\/).*/) {
                    throw new GradleException("Tracked machine path in ${path}")
                }
            }
        }
    }
}

tasks.register('verifyWorkflowPins') {
    group = 'verification'
    doLast {
        List<File> workflows = fileTree('.github/workflows') { include '*.yml'; include '*.yaml' }.files.toList()
        if (workflows.size() < 4) throw new GradleException('Expected CI, CodeQL, wrapper, and release workflows')
        workflows.each { file ->
            file.readLines('UTF-8').eachWithIndex { line, index ->
                def match = line =~ /^\s*uses:\s*([^\s#]+)(?:\s*#.*)?$/
                if (match.matches() && match.group(1).startsWith('actions/')
                        && !(match.group(1) ==~ /actions\/[^@]+@[0-9a-f]{40}/)) {
                    throw new GradleException("Unpinned action at ${file}:${index + 1}: ${line}")
                }
            }
        }
    }
}

tasks.register('validateCurseForgeProjectId') {
    group = 'publishing'
    doLast {
        if (!(project.curseforge_project_id.toString() ==~ /\d+/)) {
            throw new GradleException('CurseForge publication is disabled until curseforge_project_id is assigned')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('verifyExpandedMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<String> actual = (libs.listFiles() ?: [] as File[]).findAll { it.isFile() }.collect { it.name }.sort()
        if (actual != expectedReleaseFiles.get().sort()) {
            throw new GradleException("Expected exactly ${expectedReleaseFiles.get()}, found ${actual}")
        }
        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            if (names.size() != names.toSet().size()) throw new GradleException('Duplicate main-jar entries')
            if (!names.contains('mcmod.info') || !names.contains('zone/moddev/mc/iafbygaddon/IAFOhTheBiomesAddon.class')) {
                throw new GradleException('Main jar is missing metadata or entry point')
            }
            if (names.any { it.startsWith('assets/byg/') || it.startsWith('zone/moddev/mc/ironagefurniture/')
                    || it.startsWith('run-dependencies/') || it.startsWith('gradle/') }) {
                throw new GradleException('Main jar contains dependency assets, classes, or fixtures')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = zip.getInputStream(entry).withCloseable { it.readNBytes(8) }
                int major = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
                if (major != 52) throw new GradleException("${entry.name} is class version ${major}, expected 52")
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { zip ->
            if (zip.getEntry('zone/moddev/mc/iafbygaddon/IAFOhTheBiomesAddon.java') == null) {
                throw new GradleException('Sources jar is missing entry point')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { zip ->
            if (zip.getEntry('index.html') == null) throw new GradleException('Javadoc jar is incomplete')
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    outputs.file layout.buildDirectory.file('release/SHA256SUMS')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File output = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        output.parentFile.mkdirs()
        output.setText(expectedReleaseFiles.get().sort().collect { name ->
            "${sha256Of(new File(libs, name))}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}
tasks.register('verifyReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('writeReleaseChecksums')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        layout.buildDirectory.file('release/SHA256SUMS').get().asFile.readLines('UTF-8').each { line ->
            def parts = line.split(/\s+/, 2)
            if (sha256Of(new File(libs, parts[1])) != parts[0]) throw new GradleException("Checksum mismatch ${parts[1]}")
        }
    }
}
tasks.register('prepareReleaseBundle', Sync) {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseChecksums')
    into layout.buildDirectory.dir('prepared-release')
    from(layout.buildDirectory.dir('libs')) { include expectedReleaseFiles.get() }
    from layout.buildDirectory.file('release/SHA256SUMS')
    from 'CHANGELOG.md'
}
tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    doLast {
        if (!preparedReleaseDir.isPresent()) throw new GradleException('preparedReleaseDir is required')
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = (expectedReleaseFiles.get() + ['SHA256SUMS', 'CHANGELOG.md']).sort()
        List<String> actual = (prepared.listFiles() ?: [] as File[]).findAll { it.isFile() }.collect { it.name }.sort()
        if (actual != expected) throw new GradleException("Prepared bundle differs: ${actual}")
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateCurseForgeProjectId')
    dependsOn preparedReleaseDir.isPresent() ? tasks.named('verifyPreparedReleaseArtifacts') : tasks.named('verifyReleaseArtifacts')
}

tasks.register('syncForge12EclipseLaunches') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('processResources')
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        prefs.parentFile.mkdirs()
        def escape = { String value -> value.replace('\\', '\\\\').replace(':', '\\:') }
        String javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        prefs.setText([
                'arguments=', 'auto.sync=false', 'build.scans.enabled=false',
                'connection.gradle.distribution=GRADLE_DISTRIBUTION(WRAPPER)',
                "connection.gradle.user.home=${escape(gradle.gradleUserHomeDir.absolutePath)}",
                'connection.project.dir=', 'eclipse.preferences.version=1',
                "gradle.user.home=${escape(gradle.gradleUserHomeDir.absolutePath)}",
                "java.home=${escape(javaHome)}", 'jvm.arguments=', 'offline.mode=false',
                'override.workspace.settings=true', 'show.console.view=false', 'show.executions.view=false', ''
        ].join('\r\n'), 'UTF-8')
        File mainOutput = file('bin/main')
        copy { from layout.buildDirectory.dir('resources/main'); into mainOutput }
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = [file(name), file(".eclipse/${name}")].find { it.isFile() }
            if (launch == null) throw new GradleException("ForgeGradle did not generate ${name}")
            String text = launch.getText('UTF-8')
            def args = text =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (args.count != 1) throw new GradleException("Malformed arguments in ${name}")
            String value = args[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int start = value.indexOf(prefix)
                if (start < 0) throw new GradleException("Missing --${flag} in ${name}")
                start += prefix.length()
                int end = value.indexOf(' --', start)
                if (end < 0) throw new GradleException("Unterminated --${flag} in ${name}")
                String path = value.substring(start, end)
                if (!path.startsWith('&quot;')) value = value.substring(0, start) + '&quot;' + path + '&quot;' + value.substring(end)
            }
            text = text.replace(args[0][0], args[0][1] + value + args[0][3])
            text = text.replaceFirst(/<stringAttribute key="org\.eclipse\.jdt\.launching\.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement("<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            text = text.replaceAll(/projectName=&quot;[^&]*&quot;/,
                    java.util.regex.Matcher.quoteReplacement("projectName=&quot;${eclipseWorkspaceProjectName}&quot;"))
            text = text.replaceAll(/javaProject=&quot;[^&]*&quot;/,
                    java.util.regex.Matcher.quoteReplacement("javaProject=&quot;${eclipseWorkspaceProjectName}&quot;"))
            if (text.contains('key="MOD_CLASSES"')) {
                text = text.replaceAll(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                        java.util.regex.Matcher.quoteReplacement("<mapEntry key=\"MOD_CLASSES\" value=\"${mainOutput.absolutePath}\"/>"))
            }
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}
tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('syncForge12EclipseLaunches')
}
tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('syncForge12EclipseLaunches')
    doLast {
        if (!file('.project').getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project name is wrong')
        }
        def xml = new XmlSlurper(false, false).parse(file('.classpath'))
        xml.classpathentry.each { entry ->
            String path = entry.@path.text().replace('\\', '/')
            if (path.startsWith('src/test/') && entry.@output.text() != 'bin/test') {
                throw new GradleException("Test source is not isolated: ${path}")
            }
        }
        ['Client', 'Server'].each { run ->
            File launch = [file("run${run}.launch"), file(".eclipse/run${run}.launch")].find { it.isFile() }
            String text = launch.getText('UTF-8')
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE') || !text.contains(file('bin/main').absolutePath)
                    || !text.contains("key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")
                    || !text.contains("projectName=&quot;${eclipseWorkspaceProjectName}&quot;")
                    || !text.contains("javaProject=&quot;${eclipseWorkspaceProjectName}&quot;")) {
                throw new GradleException("Eclipse launch is not production-only: ${launch}")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!text.contains("--${flag} &quot;")) throw new GradleException("Unquoted --${flag} in ${launch}")
            }
        }
        if (!Arrays.equals(file('bin/main/mcmod.info').bytes,
                layout.buildDirectory.file('resources/main/mcmod.info').get().asFile.bytes)) {
            throw new GradleException('Eclipse metadata is stale')
        }
    }
}
tasks.matching { it.name == 'genEclipseRuns' }.configureEach { finalizedBy tasks.named('syncForge12EclipseLaunches') }
tasks.matching { it.name == 'eclipse' }.configureEach { finalizedBy tasks.named('syncForge12EclipseLaunches') }
tasks.register('prepareEclipse') {
    group = 'ide'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
}

