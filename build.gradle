tasks.register('verifyPinnedCoreArtifact') {
    group = 'verification'
    doLast {
        Set<File> artifacts = configurations.pinnedCoreArtifact.resolve()
        if (artifacts.size() != 1) throw new GradleException("Expected one IAF jar, found ${artifacts}")
        File jar = artifacts.first()
        String actual = sha256Of(jar)
        if (!actual.equalsIgnoreCase(project.ironagefurniture_sha256.toString())) {
            throw new GradleException("IAF ${project.ironagefurniture_version} checksum mismatch: ${actual}")
        }
        new ZipFile(jar).withCloseable { zip ->
            if (zip.getEntry('zone/moddev/mc/ironagefurniture/Ironagefurniture.class') == null) {
                throw new GradleException('Pinned IAF jar has no public API entry point')
            }
        }
    }
}

def dependencyManifest = layout.projectDirectory.file('gradle/verification-dependencies.json')
def dependencyArtifactsDir = layout.projectDirectory.dir('run-dependencies/artifacts')
tasks.register('verifyBYGArtifacts') {
    group = 'verification'
    inputs.file dependencyManifest
    doLast {
        Map manifest = new JsonSlurper().parse(dependencyManifest.asFile) as Map
        Map catalog = new JsonSlurper().parse(file('gradle/furniture-catalog.json')) as Map
        List<Map> bygEntries = (manifest.dependencies as List<Map>).findAll { it.modId == 'byg' }
        if (bygEntries.size() != 2) throw new GradleException('Expected official and community-fixed BYG entries')
        Set<String> expectedRegistry = catalog.woods.collectMany { [it.planks.toString(), it.log.toString()] } as Set<String>
        Set<String> expectedTextures = catalog.woods.collectMany {
            ["assets/byg/textures/blocks/${it.planksTexture}.png",
             "assets/byg/textures/blocks/${it.logTexture}.png",
             "assets/byg/textures/blocks/${it.logTopTexture}.png"]
        } as Set<String>
        Set<String> generatedTextures = new TreeSet<String>()
        fileTree('src/main/resources/assets/iafbygaddon/models/block') { include '*.json' }.files.each { modelFile ->
            Map model = new JsonSlurper().parseText(modelFile.getText('UTF-8')) as Map
            (model.textures instanceof Map ? model.textures.values() : []).findAll {
                it instanceof String && it.startsWith('byg:blocks/')
            }.each { texture ->
                generatedTextures.add("assets/byg/textures/blocks/${texture.substring('byg:blocks/'.length())}.png")
            }
        }
        if (generatedTextures != expectedTextures) {
            Set<String> missing = new TreeSet<String>(expectedTextures); missing.removeAll(generatedTextures)
            Set<String> unexpected = new TreeSet<String>(generatedTextures); unexpected.removeAll(expectedTextures)
            throw new GradleException("Generated BYG texture references differ; missing=${missing}, unexpected=${unexpected}")
        }
        Set<String> referenceWoodTextures = null
        bygEntries.each { entry ->
            File jar = new File(dependencyArtifactsDir.asFile, entry.file.toString())
            if (!jar.isFile()) throw new GradleException("Missing ${jar}; download it from ${entry.url}")
            if (!sha256Of(jar).equalsIgnoreCase(entry.sha256.toString())) {
                throw new GradleException("Checksum mismatch for ${jar.name}")
            }
            new ZipFile(jar).withCloseable { zip ->
                def metadataEntry = zip.getEntry('mcmod.info')
                if (metadataEntry == null) throw new GradleException("${jar.name} has no mcmod.info")
                def metadata = new JsonSlurper().parseText(zip.getInputStream(metadataEntry).getText('UTF-8'))
                if (!(metadata instanceof List) || !metadata.any { it.modid == 'byg' }) {
                    throw new GradleException("${jar.name} does not declare mod ID byg")
                }
                Set<String> names = new TreeSet<String>()
                Enumeration entries = zip.entries()
                while (entries.hasMoreElements()) {
                    names.add(entries.nextElement().name)
                }
                Set<String> missingRegistry = expectedRegistry.findAll {
                    !names.contains("assets/byg/blockstates/${it}.json")
                } as Set<String>
                Set<String> missingTextures = expectedTextures.findAll { !names.contains(it) } as Set<String>
                if (!missingRegistry.isEmpty() || !missingTextures.isEmpty()) {
                    throw new GradleException("${jar.name} is incompatible; missing registry=${missingRegistry}, textures=${missingTextures}")
                }
                Set<String> woodTextures = names.findAll {
                    it ==~ /assets\/byg\/textures\/blocks\/[^\/]*(?:planks|log(?:_side|_top)?)\.png/
                } as Set<String>
                if (woodTextures.size() != 136) {
                    throw new GradleException("Expected 136 BYG wood textures in ${jar.name}, found ${woodTextures.size()}")
                }
                if (referenceWoodTextures == null) referenceWoodTextures = woodTextures
                else if (referenceWoodTextures != woodTextures) {
                    throw new GradleException('Official and community-fixed BYG wood texture inventories differ')
                }
            }
        }
    }
}

tasks.register('verifyResourceJson') {
    group = 'verification'
    dependsOn tasks.named('verifyFurnitureCatalog')
    doLast {
        List<File> jsonFiles = fileTree('src/main/resources') { include '**/*.json'; include 'pack.mcmeta' }.files.sort { it.path }
        jsonFiles.each { file -> new JsonSlurper().parseText(file.getText('UTF-8').replaceFirst(/^\uFEFF/, '')) }
        if (fileTree('src/main/resources/assets/iafbygaddon/blockstates') { include '*.json' }.files.size() != 243) {
            throw new GradleException('Expected 243 blockstates')
        }
        if (fileTree('src/main/resources/assets/iafbygaddon/models/block') { include '*.json' }.files.size() != 648) {
            throw new GradleException('Expected 648 block models')
        }
        if (fileTree('src/main/resources/assets/iafbygaddon/models/item') { include '*.json' }.files.size() != 243) {
            throw new GradleException('Expected 243 item models')
        }
        fileTree('src/main/resources/assets/iafbygaddon/models') { include '**/*.json' }.files.each { file ->
            if (file.getText('UTF-8').contains('iafbygaddon:blocks/')) {
                throw new GradleException("Model references a texture the add-on does not own: ${file}")
            }
        }
        File recipeRoot = file('src/main/resources/assets/iafbygaddon/recipes')
        File advancementRoot = file('src/main/resources/assets/iafbygaddon/advancements/recipes')
        List<File> recipes = fileTree(recipeRoot) { include '*.json' }.files.sort { it.name }
        List<File> advancements = fileTree(advancementRoot) { include '*.json' }.files.sort { it.name }
        if (recipes.size() != 1053 || advancements.size() != 1053
                || recipes.collect { it.name } != advancements.collect { it.name }) {
            throw new GradleException("Expected matching inventories of 1053 recipes and advancements")
        }
        advancements.each { file ->
            String id = file.name - '.json'
            Map doc = new JsonSlurper().parse(file) as Map
            Map ingredient = doc.criteria?.has_ingredient as Map
            Map unlocked = doc.criteria?.has_the_recipe as Map
            if (!(ingredient?.conditions?.items instanceof List) || ingredient.conditions.items.size() != 1
                    || unlocked?.conditions?.recipe != "iafbygaddon:${id}"
                    || doc.rewards?.recipes != ["iafbygaddon:${id}"]
                    || doc.requirements != [['has_ingredient', 'has_the_recipe']]
                    || doc.containsKey('conditions')) {
                throw new GradleException("Invalid exact recipe advancement ${file}")
            }
        }
        List<String> localeNames = ['en_en.lang', 'en_gb.lang', 'en_us.lang']
        List<List<String>> localeLines = localeNames.collect { name ->
            File file = project.file("src/main/resources/assets/iafbygaddon/lang/${name}")
            if (!file.isFile()) throw new GradleException("Missing ${name}")
            file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        }
        if (!localeLines.every { it.size() == 1053 } || !localeLines.tail().every { it == localeLines.first() }) {
            throw new GradleException('English locale files must contain the same 1053 entries')
        }
    }
}

tasks.register('verifyExpandedMetadata') {
