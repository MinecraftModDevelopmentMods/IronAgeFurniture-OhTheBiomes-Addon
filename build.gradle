plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = project.mod_archive_name

// Toolchains and development dependencies come first. The catalog adds only BYG
// furniture; lighting and shared gameplay stay in the required Iron Age Furniture mod.
apply from: 'gradle/development/toolchain.gradle'
apply from: 'gradle/development/environment.gradle'
apply from: 'gradle/furniture-catalog.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publication.gradle'
apply from: 'gradle/verification/project.gradle'
apply from: 'gradle/development/eclipse.gradle'
apply from: 'gradle/verification/runtime.gradle'

tasks.named('check') {
    dependsOn tasks.named('verifyBuildEnvironment')
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyPinnedCoreArtifact')
    dependsOn tasks.named('verifyBYGArtifacts')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyExpandedMetadata')
    dependsOn tasks.named('verifyNamespace')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyWorkflowPins')
    dependsOn tasks.named('verifyMavenCoordinates')
}
