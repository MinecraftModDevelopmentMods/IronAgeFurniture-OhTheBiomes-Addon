import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// This file owns every generated BYG furniture resource. A normal build compares
// committed files; updateFurnitureCatalog is the deliberate editing operation.

def furnitureCatalogFile = layout.projectDirectory.file('gradle/furniture-catalog.json')
def furnitureTemplateDirectory = layout.projectDirectory.dir('gradle/furniture-templates')
def generatedJavaPath = 'src/main/java/zone/moddev/mc/iafbygaddon/init/GeneratedFurnitureCatalog.java'
def generatedRoots = [
        'src/main/resources/assets/iafbygaddon/blockstates',
        'src/main/resources/assets/iafbygaddon/models/block',
        'src/main/resources/assets/iafbygaddon/models/item',
        'src/main/resources/assets/iafbygaddon/recipes',
        'src/main/resources/assets/iafbygaddon/advancements/recipes',
        'src/main/resources/assets/iafbygaddon/lang'
]
def colours = [
        [name: 'red', title: 'Red', item: 0, carpet: 14],
        [name: 'orange', title: 'Orange', item: 1, carpet: 1],
        [name: 'magenta', title: 'Magenta', item: 2, carpet: 2],
        [name: 'light_blue', title: 'Light Blue', item: 3, carpet: 3],
        [name: 'yellow', title: 'Yellow', item: 4, carpet: 4],
        [name: 'lime', title: 'Lime', item: 5, carpet: 5],
        [name: 'pink', title: 'Pink', item: 6, carpet: 6],
        [name: 'gray', title: 'Gray', item: 7, carpet: 7],
        [name: 'light_gray', title: 'Light Gray', item: 8, carpet: 8],
        [name: 'cyan', title: 'Cyan', item: 9, carpet: 9],
        [name: 'purple', title: 'Purple', item: 10, carpet: 10],
        [name: 'blue', title: 'Blue', item: 11, carpet: 11],
        [name: 'brown', title: 'Brown', item: 12, carpet: 12],
        [name: 'green', title: 'Green', item: 13, carpet: 13],
        [name: 'white', title: 'White', item: 14, carpet: 0],
        [name: 'black', title: 'Black', item: 15, carpet: 15]
]

def readCatalog = {
    Map catalog = new JsonSlurper().parse(furnitureCatalogFile.asFile) as Map
    if (catalog.schema != 1 || catalog.minecraft != '1.12.2'
            || catalog.loader != 'forge' || catalog.modId != 'iafbygaddon'
            || catalog.woods.size() != 27) {
        throw new GradleException('Furniture catalog identity or wood count is invalid')
    }
    catalog
}
def json = { Object value -> JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n' }
def normalize = { String path -> path.replace('\\', '/') }
def writeGenerated = { File root, String relative, String content, Set<String> outputs ->
    String clean = normalize(relative)
    File destination = new File(root, clean)
    destination.parentFile.mkdirs()
    destination.setText(content.replace('\r\n', '\n'), 'UTF-8')
    outputs.add(clean)
}
def furnitureIds = { String wood ->
    String suffix = "byg_${wood}"
    [
            classic   : "chair_wood_ironage_classic_${suffix}",
            shield    : "chair_wood_ironage_shield_${suffix}",
            shortStool: "chair_wood_ironage_stool_short_${suffix}",
            tallStool : "chair_wood_ironage_stool_tall_${suffix}",
            bench     : "chair_wood_ironage_bench_single_${suffix}",
            padded    : "chair_wood_ironage_bench_padded_single_${suffix}",
            logBench  : "chair_wood_ironage_bench_log_single_${suffix}",
            backBench : "chair_wood_ironage_bench_back_single_${suffix}",
            paddedBack: "chair_wood_ironage_bench_back_padded_single_${suffix}"
    ]
}
def externalItem = { String path -> [item: "byg:${path}"] as LinkedHashMap }
def stick = { [item: 'minecraft:stick', data: 0] as LinkedHashMap }
def output = { String item, Integer count = null, Integer data = null, String nbt = null ->
    Map value = [item: "iafbygaddon:${item}"] as LinkedHashMap
    if (data != null) value.data = data
    if (count != null) value.count = count
    if (nbt != null) value.nbt = nbt
    value
}
def shaped = { String result, List<String> pattern, Map key, Map criterion, Integer count = null ->
    [recipe: [type: 'forge:ore_shaped', result: output(result, count, 0), pattern: pattern,
              key: key, group: "iafbygaddon:${result}/meta_0"] as LinkedHashMap,
     criterion: criterion]
}
def shapeless = { String result, List ingredients, Map criterion,
                  Integer resultData = null, String nbt = null ->
    [recipe: [type: 'forge:ore_shapeless', ingredients: ingredients,
              result: output(result, null, resultData, nbt), group: "iafbygaddon:${result}/meta_${resultData ?: 0}"] as LinkedHashMap,
     criterion: criterion]
}
def advancement = { String id, Map criterion ->
    [parent: 'minecraft:recipes/root',
     rewards: [recipes: ["iafbygaddon:${id}"]],
     criteria: [
             has_ingredient: [trigger: 'minecraft:inventory_changed',
                              conditions: [items: [criterion]]],
             has_the_recipe: [trigger: 'minecraft:recipe_unlocked',
                              conditions: [recipe: "iafbygaddon:${id}"]]
     ],
     requirements: [['has_ingredient', 'has_the_recipe']]] as LinkedHashMap
}

def renderCatalog = { File root ->
    Map catalog = readCatalog()
    Set<String> outputs = new TreeSet<String>()
    File templates = furnitureTemplateDirectory.asFile
    Map<String, String> language = new TreeMap<String, String>()

    StringBuilder java = new StringBuilder()
    java.append('package zone.moddev.mc.iafbygaddon.init;\n\n')
    java.append('/** Generated, immutable description of the supported BYG wood families. */\n')
    java.append('public final class GeneratedFurnitureCatalog {\n')
    java.append('    public static final Wood[] WOODS = new Wood[] {\n')
    catalog.woods.eachWithIndex { wood, index ->
        java.append('        new Wood("').append(wood.wood).append('", "')
                .append(wood.planks).append('", "').append(wood.log).append('")')
                .append(index + 1 == catalog.woods.size() ? '\n' : ',\n')
    }
    java.append('    };\n\n')
    java.append('    private GeneratedFurnitureCatalog() { throw new IllegalAccessError("This class cannot be instantiated"); }\n\n')
    java.append('    public static final class Wood {\n')
    java.append('        public final String id;\n        public final String planks;\n        public final String log;\n')
    java.append('        private Wood(String id, String planks, String log) {\n')
    java.append('            this.id = id; this.planks = planks; this.log = log;\n        }\n    }\n}\n')
    writeGenerated(root, generatedJavaPath, java.toString(), outputs)

    catalog.woods.each { wood ->
        String suffix = "_byg_${wood.wood}"
        ['blockstates', 'models/block', 'models/item'].each { category ->
            File categoryRoot = new File(templates, category)
            categoryRoot.eachFile { File template ->
                if (!template.isFile() || !template.name.endsWith('_oak.json')) return
                String destinationName = template.name.replace('_oak.json', "${suffix}.json")
                String content = template.getText('UTF-8')
                        .replace('ironagefurniture:blocks/shield_chair_back', '__IAF_SHIELD_CHAIR_BACK__')
                        .replace('minecraft:blocks/log_oak_top', '__BYG_LOG_TOP__')
                        .replace('minecraft:blocks/log_oak', '__BYG_LOG_SIDE__')
                        .replace('minecraft:blocks/planks_oak', '__BYG_PLANKS__')
                        .replace('ironagefurniture:', 'iafbygaddon:')
                        .replace('_oak', suffix)
                        .replace('__BYG_LOG_TOP__', "byg:blocks/${wood.logTopTexture}")
                        .replace('__BYG_LOG_SIDE__', "byg:blocks/${wood.logTexture}")
                        .replace('__BYG_PLANKS__', "byg:blocks/${wood.planksTexture}")
                        .replace('__IAF_SHIELD_CHAIR_BACK__', 'ironagefurniture:blocks/shield_chair_back')
                if (category == 'models/block' && template.name == 'chair_wood_ironage_shield_oak.json') {
                    // A placed shield is rendered from its saved ItemStack. Keep a complete
                    // inventory preview, but do not leave a second, permanent shield on the frame.
                    String inventoryName = destinationName.replace('.json', '_inventory.json')
                    writeGenerated(root, "src/main/resources/assets/iafbygaddon/models/block/${inventoryName}", content, outputs)
                    Map frame = new JsonSlurper().parseText(content) as Map
                    frame.elements = frame.elements.findAll { element ->
                        !element.faces.values().every { it.texture == '#2' }
                    }
                    frame.remove('groups')
                    content = json(frame)
                }
                if (category == 'models/item' && template.name == 'chair_wood_ironage_shield_oak.json')
                    content = json([parent: "iafbygaddon:block/${destinationName.replace('.json', '_inventory')}"])
                writeGenerated(root, "src/main/resources/assets/iafbygaddon/${category}/${destinationName}",
                        content, outputs)
            }
        }

        Map ids = furnitureIds(wood.wood.toString())
        Map planks = externalItem(wood.planks.toString())
        Map log = externalItem(wood.log.toString())
        Map<String, Map> recipes = new LinkedHashMap<String, Map>()
        recipes[ids.classic] = shaped(ids.classic, ['x  ', 'xxx', 'y y'],
                [x: planks, y: stick()], planks)
        recipes[ids.shield] = shapeless(ids.shield,
                [[item: 'minecraft:shield'], [item: "iafbygaddon:${ids.classic}"]],
                [item: 'minecraft:shield'] as LinkedHashMap)
        recipes[ids.shortStool] = shaped(ids.shortStool, [' x ', 'yyy'],
                [x: planks, y: stick()], planks)
        recipes[ids.tallStool] = shaped(ids.tallStool, [' x ', 'yyy', 'yyy'],
                [x: planks, y: stick()], planks)
        recipes[ids.bench] = shaped(ids.bench, ['xx', 'yy'],
                [x: planks, y: stick()], planks)
        recipes[ids.logBench] = shaped(ids.logBench, ['xxx'], [x: log],
                log, 3)
        recipes[ids.backBench] = shaped(ids.backBench, ['x ', 'xx', 'yy'],
                [x: planks, y: stick()], planks)
        colours.each { colour ->
            String paddedRecipe = "${ids.padded}_${colour.carpet}"
            recipes[paddedRecipe] = shapeless(ids.padded,
                    [[item: 'minecraft:carpet', data: colour.carpet],
                     [item: "iafbygaddon:${ids.bench}"]],
                    [item: 'minecraft:carpet', data: colour.carpet] as LinkedHashMap, colour.item,
                    "{Color:\"${colour.name}\"}")
            String paddedBackRecipe = "${ids.paddedBack}_${colour.carpet}"
            recipes[paddedBackRecipe] = shapeless(ids.paddedBack,
                    [[item: 'minecraft:carpet', data: colour.carpet],
                     [item: "iafbygaddon:${ids.backBench}"]],
                    [item: 'minecraft:carpet', data: colour.carpet] as LinkedHashMap, colour.item,
                    "{Color:\"${colour.name}\"}")
        }

        // Geometry is shared with IAF; only BYG's wood textures belong to this catalog.
        ['wingback': ['lower', 'upper', 'inventory'],
         'throne': ['lower', 'middle', 'upper', 'inventory']].each { form, parts ->
            String chair = "chair_wood_ironage_${form}_byg_${wood.wood}"
            parts.each { part ->
                String model = chair + (part == 'lower' ? '' : "_${part}")
                writeGenerated(root, "src/main/resources/assets/iafbygaddon/models/block/${model}.json",
                        json([credit: 'By FoxNekitsune',
                              parent: "ironagefurniture:block/template_chair_${form}_${part}",
                              textures: [cloth: 'minecraft:blocks/wool_colored_red',
                                log: "byg:blocks/${wood.logTexture}", particle: "byg:blocks/${wood.logTexture}",
                                planks: "byg:blocks/${wood.planksTexture}"]]), outputs)
            }
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/models/item/${chair}.json",
                    json([parent: "iafbygaddon:block/${chair}_inventory"]), outputs)
            Map variants = new LinkedHashMap()
            [north: 180, east: 270, south: 0, west: 90].each { facing, rotation ->
                ['lower', 'middle', 'upper'].each { part ->
                    String visible = part == 'lower' ? '' : (form == 'wingback' ? '_upper' : "_${part}")
                    Map variant = [model: "iafbygaddon:upholstered/${chair}${visible}"]
                    if (rotation) variant.y = rotation
                    variants["facing=${facing},part=${part}"] = variant
                }
            }
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/blockstates/${chair}.json",
                    json([variants: variants]), outputs)
            colours.each { colour ->
                String input = form == 'wingback' ? ids.classic : "chair_wood_ironage_wingback_byg_${wood.wood}"
                recipes["${chair}_${colour.name}"] = [
                    recipe: [type: 'forge:ore_shaped',
                        group: "iafbygaddon:${chair}/meta_${colour.item}",
                        pattern: ['z', 'x', 'y'],
                        key: [z: [item: 'minecraft:carpet', data: colour.carpet], x: planks,
                              y: [item: "iafbygaddon:${input}", data: form == 'throne' ? 32767 : 0]],
                        result: output(chair, null, colour.item, "{Color:\"${colour.name}\"}")],
                    criterion: [item: 'minecraft:carpet', data: colour.carpet]]
            }
        }
        List bedStems = [
            'bed_canopy_double_inventory', 'bed_canopy_foot_left_lower', 'bed_canopy_foot_left_upper',
            'bed_canopy_foot_lower', 'bed_canopy_foot_right_lower', 'bed_canopy_foot_right_upper',
            'bed_canopy_foot_upper', 'bed_canopy_head_left_lower', 'bed_canopy_head_left_upper',
            'bed_canopy_head_lower', 'bed_canopy_head_right_lower', 'bed_canopy_head_right_upper',
            'bed_canopy_head_upper', 'bed_canopy_single_inventory', 'bed_wood_double_inventory',
            'bed_wood_foot_left', 'bed_wood_foot', 'bed_wood_foot_right', 'bed_wood_head_left',
            'bed_wood_head', 'bed_wood_head_right', 'bed_wood_single_inventory']
        bedStems.each { stem ->
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/models/block/${stem}_byg_${wood.wood}.json",
                    json([credit: 'By FoxNekitsune', parent: "ironagefurniture:block/template_${stem}",
                          textures: [cloth: 'minecraft:blocks/wool_colored_red',
                            sheet: 'minecraft:blocks/wool_colored_white',
                            log: "byg:blocks/${wood.logTexture}", particle: "byg:blocks/${wood.logTexture}",
                            planks: "byg:blocks/${wood.planksTexture}"]]), outputs)
        }
        [bed_wood_foot: 'bed_wood_single_inventory', bed_wood_foot_left: 'bed_wood_double_inventory',
         bed_canopy_foot_lower: 'bed_canopy_single_inventory',
         bed_canopy_foot_left_lower: 'bed_canopy_double_inventory'].each { stem, inventory ->
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/models/item/${stem}_byg_${wood.wood}.json",
                    json([parent: "iafbygaddon:block/${inventory}_byg_${wood.wood}"]), outputs)
        }
        String wooden = "bed_wood_foot_byg_${wood.wood}"
        String woodenDouble = "bed_wood_foot_left_byg_${wood.wood}"
        String canopy = "bed_canopy_foot_lower_byg_${wood.wood}"
        String canopyDouble = "bed_canopy_foot_left_lower_byg_${wood.wood}"
        colours.each { colour ->
            String woodenRecipe = colour.name == 'red' ? wooden : "${wooden}_${colour.name}"
            recipes[woodenRecipe] = shapeless(wooden,
                    [[item: 'minecraft:bed', data: colour.carpet], planks],
                    [item: 'minecraft:bed', data: colour.carpet], colour.item,
                    "{Color:\"${colour.name}\"}")
            recipes["${canopy}_${colour.name}"] = [
                recipe: [type: 'ironagefurniture:canopy_bed_upgrade',
                    group: "iafbygaddon:${canopy}/meta_${colour.item}",
                    ingredients: [[item: "iafbygaddon:${wooden}", data: colour.item,
                                   nbt: "{Color:\"${colour.name}\"}"], planks],
                    result: output(canopy, null, colour.item, "{Color:\"${colour.name}\"}")],
                criterion: [item: "iafbygaddon:${wooden}", nbt: "{Color:\"${colour.name}\"}"]]
        }
        [[wooden, woodenDouble], [canopy, canopyDouble]].each { pair ->
            recipes[pair[1]] = [
                recipe: [type: 'ironagefurniture:matching_upholstery',
                    group: "iafbygaddon:${pair[1]}/matching_upholstery",
                    ingredients: [[item: "iafbygaddon:${pair[0]}", data: 32767],
                                  [item: "iafbygaddon:${pair[0]}", data: 32767]],
                    result: output(pair[1])],
                criterion: [item: "iafbygaddon:${pair[0]}"]]
        }
        [wooden, woodenDouble, canopy, canopyDouble].each { bed ->
            recipes["${bed}_recolour"] = [
                recipe: [type: 'ironagefurniture:bed_recolour',
                    group: "iafbygaddon:${bed}/bed_recolour",
                    ingredients: [[item: "iafbygaddon:${bed}", data: 32767],
                                  [item: 'minecraft:carpet', data: 32767]],
                    result: output(bed)],
                criterion: [item: "iafbygaddon:${bed}"]]
        }
        recipes[ids.shield].recipe.type = 'ironagefurniture:shield_chair'
        recipes.each { String id, Map definition ->
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/recipes/${id}.json",
                    json(definition.recipe), outputs)
            writeGenerated(root, "src/main/resources/assets/iafbygaddon/advancements/recipes/${id}.json",
                    json(advancement(id, definition.criterion as Map)), outputs)
        }

        String prefix = 'tile.iafbygaddon.'
        language["${prefix}${ids.classic}.name"] = "${wood.display} Classic Chair"
        language["${prefix}${ids.shield}.name"] = "${wood.display} Shield Chair"
        language["${prefix}${ids.shortStool}.name"] = "${wood.display} Short Stool"
        language["${prefix}${ids.tallStool}.name"] = "${wood.display} Tall Stool"
        language["${prefix}${ids.bench}.name"] = "${wood.display} Bench"
        language["${prefix}${ids.logBench}.name"] = "${wood.display} Log Bench"
        language["${prefix}${ids.backBench}.name"] = "${wood.display} Back Bench"
        ['wingback': 'Wingback Chair', 'throne': 'Throne',
         'bed_wood_foot': 'Wooden Bed', 'bed_wood_foot_left': 'Double Wooden Bed',
         'bed_canopy_foot_lower': 'Canopy Bed', 'bed_canopy_foot_left_lower': 'Double Canopy Bed'].each { stem, title ->
            String path = stem in ['wingback', 'throne']
                    ? "chair_wood_ironage_${stem}_byg_${wood.wood}" : "${stem}_byg_${wood.wood}"
            colours.each { colour ->
                String colourSuffix = colour.name == 'red' ? '.name' : ".${colour.name}.name"
                language["${prefix}${path}${colourSuffix}"] = "${wood.display} ${colour.title} ${title}"
            }
        }
        colours.each { colour ->
            String paddedSuffix = colour.name == 'red' ? '.name' : ".${colour.name}.name"
            language["${prefix}${ids.padded}${paddedSuffix}"] =
                    "${wood.display} ${colour.title} Padded Bench"
            language["${prefix}${ids.paddedBack}${paddedSuffix}"] =
                    "${wood.display} ${colour.title} Padded Back Bench"
        }
    }

    String languageText = language.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
    Map labels = new JsonSlurper().parse(file('gradle/furniture-labels.json')) as Map
    ['de_au', 'de_de', 'en_ca', 'en_en', 'en_gb', 'en_pt', 'en_us', 'es_es', 'es_mx',
     'fr_ca', 'fr_fr', 'ja_jp', 'ko_kr', 'pt_br', 'pt_pt', 'ru_ru', 'zh_cn'].each { locale ->
        String translated = languageText
        String languageId = locale.substring(0, 2)
        if (languageId != 'en') {
            Map local = labels[languageId] as Map
            Map english = labels.en as Map
            translated = language.collect { key, value ->
                String text = value.toString()
                String title = english.forms.findAll { text.endsWith(' ' + it) }.sort { -it.length() }.find()
                if (title != null) text = text.substring(0, text.length() - title.length()) + local.forms[english.forms.indexOf(title)]
                colours.eachWithIndex { colour, int index -> text = text.replace(' ' + colour.title + ' ', ' ' + local.colours[index] + ' ') }
                "${key}=${text}"
            }.join('\n') + '\n'
        }
        writeGenerated(root, "src/main/resources/assets/iafbygaddon/lang/${locale}.lang",
                translated, outputs)
    }
    outputs
}

def managedActualPaths = {
    Set<String> paths = new TreeSet<String>()
    File javaFile = file(generatedJavaPath)
    if (javaFile.isFile()) paths.add(generatedJavaPath)
    generatedRoots.each { relativeRoot ->
        File directory = file(relativeRoot)
        if (directory.isDirectory()) {
            directory.eachFileRecurse { File candidate ->
                if (candidate.isFile()) {
                    paths.add(normalize(project.projectDir.toPath().relativize(candidate.toPath()).toString()))
                }
            }
        }
    }
    paths
}

tasks.register('updateFurnitureCatalog') {
    group = 'generation'
    description = 'Explicitly regenerates all catalog-owned Java and resources.'
    inputs.file furnitureCatalogFile
    inputs.file 'gradle/furniture-labels.json'
    inputs.dir furnitureTemplateDirectory
    outputs.upToDateWhen { false }
    doLast {
        file(generatedJavaPath).delete()
        generatedRoots.each { project.delete(file(it)) }
        renderCatalog(project.projectDir)
    }
}

tasks.register('verifyFurnitureCatalog') {
    group = 'verification'
    description = 'Regenerates the catalog into a temporary tree and compares every file.'
    inputs.file furnitureCatalogFile
    inputs.file 'gradle/furniture-labels.json'
    inputs.dir furnitureTemplateDirectory
    doLast {
        File expectedRoot = layout.buildDirectory.dir('verification/furniture-catalog').get().asFile
        project.delete(expectedRoot)
        expectedRoot.mkdirs()
        Set<String> expected = renderCatalog(expectedRoot)
        Set<String> actual = managedActualPaths()
        if (actual != expected) {
            Set<String> missing = new TreeSet<String>(expected); missing.removeAll(actual)
            Set<String> stale = new TreeSet<String>(actual); stale.removeAll(expected)
            throw new GradleException("Catalog inventory differs; missing=${missing.take(10)}, stale=${stale.take(10)}")
        }
        expected.each { relative ->
            File expectedFile = new File(expectedRoot, relative)
            File actualFile = new File(project.projectDir, relative)
            // Git may check out CRLF on Windows; compare the same canonical text used in the jars.
            String expectedText = expectedFile.getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n')
            String actualText = actualFile.getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n')
            if (expectedText != actualText) {
                throw new GradleException("Catalog output differs; run updateFurnitureCatalog: ${relative}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFurnitureCatalog')
}
