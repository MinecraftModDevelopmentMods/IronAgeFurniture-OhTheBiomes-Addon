name: IAF Oh The Biomes Add-On 1.12.2 CI

on:
  push:
    branches: [master-1.12, 'feature/**']
  pull_request:
    branches: [master-1.12]

permissions:
  contents: read

concurrency:
  group: iaf-byg-addon-1.12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-build:
    name: Cold bootstrap and reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Java 25 ForgeGradle Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 compiler
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Fetch checksum-pinned BYG test jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-dependencies/artifacts
          curl --fail --location --retry 3 --output run-dependencies/artifacts/BiomesYouGo1.7.1.jar https://edge.forgecdn.net/files/2833/179/BiomesYouGo1.7.1.jar
          curl --fail --location --retry 3 --output run-dependencies/artifacts/BYG_1.12.2_1.9.jar https://edge.forgecdn.net/files/8169/771/BYG_1.12.2_1.9.jar
          echo '0ede6fac09cf7019d214811c32ae1e805b1814776eca983cc9ad3a7cdffbf635  run-dependencies/artifacts/BiomesYouGo1.7.1.jar' | sha256sum --check
          echo '5782debc8cbd1417e95c1a9726924f73612ed01c57ab289f40b5d7d2c1763494  run-dependencies/artifacts/BYG_1.12.2_1.9.jar' | sha256sum --check
      - name: Build from an empty cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/iaf-byg-addon-cold-gradle
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          ./gradlew clean check build javadoc verifyReleaseArtifacts verifyReleaseChecksums prepareReleaseBundle \
            --no-daemon --no-build-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          ./gradlew verifyPreparedReleaseArtifacts \
            -PpreparedReleaseDir=build/prepared-release \
            --no-daemon --no-build-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          sha256sum \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021.jar \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021-sources.jar \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021-javadoc.jar \
            > "$RUNNER_TEMP/artifacts-first.sha256"
          find .gradle/mavenizer \
            -type f \( -name '*.jar' -o -name '*.json' -o -name '*.pom' -o -name '*.module' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/mavenizer-first.sha256"
          test -s "$RUNNER_TEMP/mavenizer-first.sha256"
      - name: Verify same-source rebuild is identical
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/iaf-byg-addon-cold-gradle
        run: |
          set -euo pipefail
          ./gradlew clean build javadoc verifyReleaseArtifacts \
            --no-daemon --no-build-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          sha256sum \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021.jar \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021-sources.jar \
            build/libs/iron-age-furniture-oh-the-biomes-addon-0.3.0.112021-javadoc.jar \
            > "$RUNNER_TEMP/artifacts-second.sha256"
          diff -u "$RUNNER_TEMP/artifacts-first.sha256" "$RUNNER_TEMP/artifacts-second.sha256"
          find .gradle/mavenizer \
            -type f \( -name '*.jar' -o -name '*.json' -o -name '*.pom' -o -name '*.module' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/mavenizer-second.sha256"
          diff -u "$RUNNER_TEMP/mavenizer-first.sha256" "$RUNNER_TEMP/mavenizer-second.sha256"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Java 25 ForgeGradle Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 compiler
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Fetch checksum-pinned BYG test jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-dependencies/artifacts
          curl --fail --location --retry 3 --output run-dependencies/artifacts/BiomesYouGo1.7.1.jar https://edge.forgecdn.net/files/2833/179/BiomesYouGo1.7.1.jar
          curl --fail --location --retry 3 --output run-dependencies/artifacts/BYG_1.12.2_1.9.jar https://edge.forgecdn.net/files/8169/771/BYG_1.12.2_1.9.jar
          echo '0ede6fac09cf7019d214811c32ae1e805b1814776eca983cc9ad3a7cdffbf635  run-dependencies/artifacts/BiomesYouGo1.7.1.jar' | sha256sum --check
          echo '5782debc8cbd1417e95c1a9726924f73612ed01c57ab289f40b5d7d2c1763494  run-dependencies/artifacts/BYG_1.12.2_1.9.jar' | sha256sum --check
      - name: Build and audit
        run: |
          chmod +x ./gradlew
          ./gradlew clean check build javadoc verifyReleaseArtifacts verifyReleaseChecksums prepareReleaseBundle \
            --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
      - name: Verify Eclipse project
        run: >-
          ./gradlew prepareEclipse verifyEclipseProductionClasspath
          --no-daemon --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false
      - name: Verify prepared release bundle
        run: >-
          ./gradlew verifyPreparedReleaseArtifacts
          -PpreparedReleaseDir=build/prepared-release
          --no-daemon --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iaf-oh-the-biomes-addon-1.12.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: build/prepared-release/**
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iaf-oh-the-biomes-addon-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/reports/**
            build/test-results/**
            run/logs/**
